name: Build Windows desktop app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test, and package
        shell: powershell
        run: ./build.ps1 -Test -Package
      - uses: actions/upload-artifact@v4
        with:
          name: TomatoLock-1.1.0-win-x64
          path: releases/*
